services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      API_PORT: 3010
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
    volumes:
      - api-storage:/app/services/api/storage
    ports:
      - "3010:3010"

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - api
    ports:
      - "8080:80"

  media-worker:
    build:
      context: .
      dockerfile: services/media-worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_ROOT: /app/services/api/storage
    depends_on:
      - api
    volumes:
      - api-storage:/app/services/api/storage

volumes:
  api-storage:
